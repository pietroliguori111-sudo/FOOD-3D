<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ver un modelo</title>
<!--
  Visor suelto para revisar un escaneo antes de meterlo en la carta.
  Uso:  http://localhost:8765/tools/ver.html?m=../models/21_9_2026.glb
  Muestra las medidas reales del modelo y una regla de 10 cm para comparar.
-->
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #14110d; color: #EDE6D8; }
  model-viewer { width: 100vw; height: 100vh; display: block; background: #2a241c; }
  .hud {
    position: fixed; left: 12px; top: 12px; background: rgba(20,17,13,.85); padding: 10px 12px;
    border-radius: 8px; line-height: 1.6; font-variant-numeric: tabular-nums;
  }
  .hud b { color: #E5B65A; }
</style>
<model-viewer id="mv" camera-controls shadow-intensity="1" exposure="1.05"
  tone-mapping="neutral" environment-image="neutral" camera-orbit="35deg 65deg auto"></model-viewer>
<div class="hud" id="hud">cargando…</div>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
<script type="module">
  const mv = document.querySelector('#mv');
  const p = new URLSearchParams(location.search);
  mv.src = p.get('m') || '../models/21_9_2026.glb';
  if (p.get('orbit')) mv.cameraOrbit = p.get('orbit');
  mv.addEventListener('load', () => {
    const d = mv.getDimensions();
    const cm = (v) => (v * 100).toFixed(1);
    document.querySelector('#hud').innerHTML =
      `<b>${mv.src.split('/').pop()}</b><br>` +
      `largo X: ${cm(d.x)} cm<br>alto Y: ${cm(d.y)} cm<br>ancho Z: ${cm(d.z)} cm`;
  });
</script>
